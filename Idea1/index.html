<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#140f1e; --panel:#231a34; --panel-2:#2c2144;
    --chrome:#d6dee6; --chrome-dim:#8891a3;
    --neon-pink:#ff2f92; --neon-cyan:#19e6cf; --amber:#ffb238;
    --text-light:#f4efe4; --line:rgba(214,222,230,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, #2a1f42 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, #1c2b3a 0%, transparent 50%),
      var(--bg-deep);
    color:var(--text-light); font-family:'Space Grotesk', sans-serif;
    min-height:100vh; padding:28px 16px 60px; display:flex; justify-content:center;
  }
  .app{width:100%;max-width:920px;}
  .marquee{text-align:center; padding:22px 10px 26px;}
  .marquee .bulbs{display:flex; justify-content:center; gap:9px; margin-bottom:10px;}
  .marquee .bulbs span{width:6px;height:6px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 6px 2px rgba(255,178,56,0.7); animation: twinkle 1.8s infinite ease-in-out;}
  .marquee .bulbs span:nth-child(odd){animation-delay:.4s;}
  .marquee .bulbs span:nth-child(3n){animation-delay:.9s;}
  @keyframes twinkle{ 0%,100%{opacity:.35;} 50%{opacity:1;} }
  .marquee h1{
    font-family:'Monoton', cursive; font-weight:400; font-size:clamp(2.4rem, 8vw, 4.2rem);
    letter-spacing:.06em; margin:0; color:var(--neon-pink);
    text-shadow:0 0 6px var(--neon-pink), 0 0 18px var(--neon-pink), 0 0 40px rgba(255,47,146,0.55);
    animation: flicker 5s infinite;
  }
  @keyframes flicker{0%,19%,21%,23%,80%,100%{opacity:1;} 20%,22%,79%{opacity:.55;}}
  .marquee .sub{font-family:'Space Mono', monospace; font-size:.7rem; letter-spacing:.35em;
    text-transform:uppercase; color:var(--neon-cyan); text-shadow:0 0 8px rgba(25,230,207,0.6); margin-top:6px;}

  .deck{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line); border-radius:22px; padding:26px;
    display:grid; grid-template-columns:220px 1fr; gap:28px;
    box-shadow:0 20px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  @media (max-width:640px){ .deck{grid-template-columns:1fr; justify-items:center; text-align:center;} }

  .vinyl-wrap{width:200px;height:200px;position:relative;}
  .vinyl{width:200px;height:200px;border-radius:50%;
    background:repeating-radial-gradient(circle at center, #0c0a12 0 2px, #17131f 2px 4px);
    position:relative; box-shadow:0 10px 30px rgba(0,0,0,0.5); transition:transform .4s ease;}
  .vinyl.spinning{ animation: spin 3.2s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .vinyl .label{position:absolute; top:50%; left:50%; width:82px; height:82px;
    transform:translate(-50%,-50%); border-radius:50%; background-size:cover; background-position:center;
    border:3px solid #0c0a12; display:flex; align-items:center; justify-content:center;}
  .vinyl .label::after{content:'';width:10px;height:10px;border-radius:50%;
    background:var(--bg-deep); border:2px solid var(--chrome-dim);}
  .vinyl-shine{position:absolute; inset:0; border-radius:50%;
    background:linear-gradient(120deg, rgba(255,255,255,0.10), transparent 40%); pointer-events:none;}

  .now-playing .eyebrow{font-family:'Space Mono',monospace; font-size:.7rem; letter-spacing:.25em;
    text-transform:uppercase; color:var(--neon-cyan);}
  .now-playing h2{margin:6px 0 2px; font-size:1.35rem; font-weight:700; color:var(--text-light);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .now-playing .author{color:var(--chrome-dim); font-size:.9rem; margin-bottom:14px;}
  .now-playing .code-badge{display:inline-block; font-family:'Space Mono',monospace;
    background:rgba(255,178,56,0.15); color:var(--amber); border:1px solid rgba(255,178,56,0.4);
    padding:2px 8px; border-radius:6px; font-size:.75rem; margin-bottom:8px;}

  .progress-row{display:flex; align-items:center; gap:10px; margin:10px 0 18px;}
  .time{font-family:'Space Mono',monospace; font-size:.75rem; color:var(--chrome-dim); width:38px;}
  .progress-track{flex:1; height:6px; background:rgba(255,255,255,0.08); border-radius:4px; position:relative; cursor:pointer;}
  .progress-fill{position:absolute; top:0; left:0; height:100%; border-radius:4px;
    background:linear-gradient(90deg, var(--neon-cyan), var(--neon-pink)); width:0%;}

  .controls{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .btn-circle{width:42px;height:42px;border-radius:50%; background:var(--bg-deep); border:1px solid var(--line);
    color:var(--chrome); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s;}
  .btn-circle:hover{border-color:var(--neon-pink); color:var(--neon-pink);}
  .btn-circle.main{width:54px;height:54px; background:var(--neon-pink); color:#140f1e; border:none;
    box-shadow:0 0 18px rgba(255,47,146,0.55);}
  .btn-circle.main:hover{ background:var(--neon-cyan); box-shadow:0 0 18px rgba(25,230,207,0.55); color:#140f1e;}
  .toggle{width:36px;height:36px;border-radius:8px; background:transparent; border:1px solid var(--line);
    color:var(--chrome-dim); cursor:pointer; font-size:.85rem; display:flex; align-items:center; justify-content:center;}
  .toggle.active{ border-color:var(--neon-cyan); color:var(--neon-cyan); background:rgba(25,230,207,0.1); }
  .volume-row{display:flex; align-items:center; gap:8px; margin-left:auto;}
  input[type=range]{ -webkit-appearance:none; width:90px; height:4px; border-radius:2px; background:rgba(255,255,255,0.15); }
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--chrome); cursor:pointer; border:2px solid var(--bg-deep);}

  .add-row{margin:26px 0 6px; display:flex; gap:10px; flex-wrap:wrap;}
  .add-row input{flex:1; min-width:220px; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:13px 16px; color:var(--text-light); font-family:'Space Grotesk'; font-size:.92rem;}
  .add-row input:focus{outline:none; border-color:var(--neon-cyan);}
  .add-row button{background:var(--amber); color:#1e1608; border:none; border-radius:12px; padding:0 22px;
    font-weight:700; letter-spacing:.03em; cursor:pointer; font-family:'Space Grotesk'; font-size:.9rem;}
  .add-row button:hover{ filter:brightness(1.08); }
  .hint{font-size:.75rem; color:var(--chrome-dim); margin:0 0 18px 2px;}

  .genre-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
  .genre-row select, .genre-row input[type=number]{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--text-light);
    padding:10px 12px; font-family:'Space Grotesk'; font-size:.88rem;
  }
  .genre-row button{
    background:var(--neon-cyan); color:#0c221f; border:none; border-radius:10px; padding:10px 18px;
    font-weight:700; cursor:pointer; font-family:'Space Grotesk'; font-size:.88rem;
  }
  .genre-row button:disabled{ opacity:.6; cursor:not-allowed; }
  .genre-row label{font-size:.8rem; color:var(--chrome-dim);}

  .queue-header{display:flex; align-items:center; gap:10px; margin:8px 0 12px;}
  .queue-header .line{flex:1; height:1px; background:var(--line);}
  .queue-header span{font-family:'Space Mono',monospace; font-size:.72rem; letter-spacing:.3em;
    text-transform:uppercase; color:var(--chrome-dim);}
  .queue{ display:flex; flex-direction:column; gap:8px; }
  .track{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; cursor:pointer; transition:.15s;}
  .track:hover{ border-color:var(--neon-pink); }
  .track.current{ border-color:var(--neon-cyan); background:rgba(25,230,207,0.06); }
  .track .code{font-family:'Space Mono',monospace; color:var(--amber); font-weight:700; font-size:.85rem; width:32px; flex-shrink:0;}
  .track img{ width:36px; height:36px; border-radius:6px; object-fit:cover; flex-shrink:0; }
  .track .meta{ flex:1; min-width:0; }
  .track .meta .t{ font-size:.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track .meta .a{ font-size:.75rem; color:var(--chrome-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track .play-mini{ color:var(--chrome-dim); font-size:.9rem; }
  .track .remove{background:none; border:none; color:var(--chrome-dim); cursor:pointer; font-size:1rem; padding:4px 6px;}
  .track .remove:hover{ color:var(--neon-pink); }
  .empty{text-align:center; color:var(--chrome-dim); font-size:.85rem; padding:26px 10px;
    border:1px dashed var(--line); border-radius:12px;}
  .status-msg{ font-size:.78rem; color:var(--chrome-dim); margin:-8px 0 16px 2px; min-height:1em; }
  .status-msg.error{ color:var(--neon-pink); }

  #yt-player-holder{ position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
</style>
</head>
<body>

<div class="app">

  <div class="marquee">
    <div class="bulbs"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <h1>Rocola</h1>
    <div class="sub">5 monedas · 1 canción</div>
  </div>

  <div class="deck">
    <div class="vinyl-wrap">
      <div class="vinyl" id="vinyl">
        <div class="label" id="vinylLabel"></div>
        <div class="vinyl-shine"></div>
      </div>
    </div>

    <div class="now-playing">
      <div class="eyebrow">Sonando ahora</div>
      <div class="code-badge" id="npCode">— —</div>
      <h2 id="npTitle">Elige una canción de la lista</h2>
      <div class="author" id="npAuthor">Pega un enlace o busca por género abajo</div>

      <div class="progress-row">
        <span class="time" id="curTime">0:00</span>
        <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
        <span class="time" id="durTime">0:00</span>
      </div>

      <div class="controls">
        <button class="toggle" id="shuffleBtn" title="Aleatorio">🔀</button>
        <button class="btn-circle" id="prevBtn" title="Anterior">⏮</button>
        <button class="btn-circle main" id="playBtn" title="Reproducir">▶</button>
        <button class="btn-circle" id="nextBtn" title="Siguiente">⏭</button>
        <button class="toggle" id="repeatBtn" title="Repetir">🔁</button>
        <div class="volume-row">
          <span style="font-size:.85rem;color:var(--chrome-dim);">🔊</span>
          <input type="range" id="volume" min="0" max="100" value="70">
        </div>
      </div>
    </div>
  </div>

  <div class="add-row">
    <input type="text" id="urlInput" placeholder="Pega el enlace de YouTube aquí…">
    <button id="addBtn">Agregar</button>
  </div>
  <p class="hint">Ejemplo: https://www.youtube.com/watch?v=XXXXXXXXXXX</p>

  <div class="genre-row">
    <label>Género:</label>
    <select id="genreSelect">
      <option>Rock</option><option>Pop</option><option>Reguetón</option><option>Salsa</option>
      <option>Cumbia</option><option>Jazz</option><option>Electrónica</option><option>Hip Hop</option>
      <option>Balada</option><option>Rancheras</option><option>Bachata</option><option>Merengue</option>
      <option>Metal</option><option>Indie</option><option>Trap</option><option>Vallenato</option>
    </select>
    <label>Cantidad:</label>
    <input type="number" id="genreCount" min="1" max="10" value="3" style="width:60px;">
    <button id="genreBtn">🎲 Agregar del género</button>
  </div>
  <p class="status-msg" id="statusMsg"></p>

  <div class="queue-header"><span>Selecciones</span><div class="line"></div></div>
  <div class="queue" id="queue"><div class="empty" id="emptyMsg">La rocola está vacía. Agrega tu primera canción arriba.</div></div>

</div>

<div id="yt-player-holder"><div id="ytplayer"></div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // ---------- Estado ----------
  let queueList = [];
  let currentIndex = -1;
  let player = null;
  let playerReady = false;
  let isPlaying = false;
  let shuffleOn = false;
  let repeatMode = 0;
  let progressTimer = null;

  const $ = id => document.getElementById(id);
  const els = {
    queue:$('queue'), emptyMsg:$('emptyMsg'), urlInput:$('urlInput'), addBtn:$('addBtn'),
    npTitle:$('npTitle'), npAuthor:$('npAuthor'), npCode:$('npCode'),
    playBtn:$('playBtn'), prevBtn:$('prevBtn'), nextBtn:$('nextBtn'),
    shuffleBtn:$('shuffleBtn'), repeatBtn:$('repeatBtn'), volume:$('volume'),
    vinyl:$('vinyl'), vinylLabel:$('vinylLabel'),
    progressTrack:$('progressTrack'), progressFill:$('progressFill'),
    curTime:$('curTime'), durTime:$('durTime'),
    genreSelect:$('genreSelect'), genreCount:$('genreCount'), genreBtn:$('genreBtn'),
    statusMsg:$('statusMsg'),
  };

  function codeForIndex(i){
    const letter = String.fromCharCode(65 + Math.floor(i / 9));
    return letter + ((i % 9) + 1);
  }

  function extractVideoId(url){
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
      /(?:youtu\.be\/)([\w-]{11})/,
      /(?:youtube\.com\/shorts\/)([\w-]{11})/,
      /(?:youtube\.com\/embed\/)([\w-]{11})/,
    ];
    for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
    if(/^[\w-]{11}$/.test(url.trim())) return url.trim();
    return null;
  }

  function setStatus(msg, isError){
    els.statusMsg.textContent = msg || '';
    els.statusMsg.classList.toggle('error', !!isError);
  }

  // ---------- Agregar por URL ----------
  async function addSong(){
    const raw = els.urlInput.value.trim();
    if(!raw) return;
    const videoId = extractVideoId(raw);
    if(!videoId){ setStatus('No reconozco ese enlace de YouTube.', true); return; }

    let title = 'Título no disponible', author = '';
    try{
      const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
      if(res.ok){ const data = await res.json(); title = data.title || title; author = data.author_name || ''; }
    }catch(e){}

    addTrackToQueue({ videoId, title, author, thumb:`https://img.youtube.com/vi/${videoId}/hqdefault.jpg` });
    els.urlInput.value = '';
  }

  function addTrackToQueue(t){
    const track = { ...t, code: codeForIndex(queueList.length) };
    queueList.push(track);
    renderQueue();
    if(currentIndex === -1) playIndex(0);
  }

  // ---------- Agregar por género (vía backend propio) ----------
  async function addRandomByGenre(){
    const genre = els.genreSelect.value;
    const count = Math.min(10, Math.max(1, parseInt(els.genreCount.value, 10) || 3));
    const existingIds = queueList.map(t => t.videoId).join(',');

    els.genreBtn.disabled = true;
    els.genreBtn.textContent = 'Buscando…';
    setStatus('');

    try{
      const res = await fetch(`/api/search?genre=${encodeURIComponent(genre)}&count=${count}&existing=${encodeURIComponent(existingIds)}`);
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Error al buscar.');
      if(!data.results.length){ setStatus(`No encontré resultados nuevos para "${genre}".`, true); }
      data.results.forEach(r => addTrackToQueue({
        videoId: r.videoId, title: r.title, author: r.channel, thumb: r.thumbnail,
      }));
    }catch(e){
      setStatus(e.message, true);
    }finally{
      els.genreBtn.disabled = false;
      els.genreBtn.textContent = '🎲 Agregar del género';
    }
  }

  // ---------- Render ----------
  function renderQueue(){
    els.queue.innerHTML = '';
    if(queueList.length === 0){ els.queue.appendChild(els.emptyMsg); return; }
    queueList.forEach((t, i)=>{
      const row = document.createElement('div');
      row.className = 'track' + (i === currentIndex ? ' current' : '');
      row.innerHTML = `
        <span class="code">${t.code}</span>
        <img src="${t.thumb}" alt="">
        <div class="meta">
          <div class="t">${escapeHtml(t.title)}</div>
          <div class="a">${escapeHtml(t.author)}</div>
        </div>
        <span class="play-mini">${i === currentIndex && isPlaying ? '⏸' : '▶'}</span>
        <button class="remove" title="Quitar">✕</button>`;
      row.querySelector('.play-mini').addEventListener('click', (e)=>{
        e.stopPropagation();
        if(i === currentIndex){ togglePlay(); } else { playIndex(i); }
      });
      row.querySelector('.remove').addEventListener('click', (e)=>{ e.stopPropagation(); removeTrack(i); });
      row.addEventListener('click', ()=> playIndex(i));
      els.queue.appendChild(row);
    });
  }

  function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  function removeTrack(i){
    const wasCurrent = i === currentIndex;
    queueList.splice(i,1);
    queueList.forEach((t, idx)=> t.code = codeForIndex(idx));
    if(queueList.length === 0){ currentIndex = -1; stopPlayback(); }
    else if(wasCurrent){ currentIndex = Math.min(i, queueList.length - 1); playIndex(currentIndex); }
    else if(i < currentIndex){ currentIndex -= 1; }
    renderQueue();
  }

  // ---------- Reproductor oficial de YouTube ----------
  function onYouTubeIframeAPIReady(){
    player = new YT.Player('ytplayer', {
      height:'1', width:'1', playerVars:{ playsinline:1, controls:0 },
      events:{
        onReady: ()=>{ playerReady = true; player.setVolume(Number(els.volume.value)); },
        onStateChange: onPlayerStateChange,
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  function onPlayerStateChange(e){
    if(e.data === YT.PlayerState.PLAYING){
      isPlaying = true; updatePlayButton(); startProgressLoop(); els.vinyl.classList.add('spinning');
    } else if(e.data === YT.PlayerState.PAUSED){
      isPlaying = false; updatePlayButton(); stopProgressLoop(); els.vinyl.classList.remove('spinning');
    } else if(e.data === YT.PlayerState.ENDED){
      handleTrackEnd();
    }
  }

  function playIndex(i){
    if(!queueList[i] || !playerReady){ if(!playerReady) setTimeout(()=>playIndex(i), 300); return; }
    currentIndex = i;
    const t = queueList[i];
    player.loadVideoById(t.videoId);
    player.setVolume(Number(els.volume.value));
    els.npTitle.textContent = t.title;
    els.npAuthor.textContent = t.author || 'Artista desconocido';
    els.npCode.textContent = t.code;
    els.vinylLabel.style.backgroundImage = `url(${t.thumb})`;
    renderQueue();
  }

  function togglePlay(){
    if(currentIndex === -1){ if(queueList.length) playIndex(0); return; }
    if(!playerReady) return;
    if(isPlaying){ player.pauseVideo(); } else { player.playVideo(); }
  }

  function stopPlayback(){
    if(player && playerReady) player.stopVideo();
    isPlaying = false; updatePlayButton(); els.vinyl.classList.remove('spinning');
    els.npTitle.textContent = 'Elige una canción de la lista';
    els.npAuthor.textContent = 'Pega un enlace o busca por género abajo';
    els.npCode.textContent = '— —';
    els.vinylLabel.style.backgroundImage = '';
    stopProgressLoop();
    els.progressFill.style.width = '0%'; els.curTime.textContent = '0:00'; els.durTime.textContent = '0:00';
  }

  function updatePlayButton(){ els.playBtn.textContent = isPlaying ? '⏸' : '▶'; renderQueue(); }

  function handleTrackEnd(){
    if(repeatMode === 2){ playIndex(currentIndex); return; }
    goNext(true);
  }

  function pickNextIndex(auto){
    if(queueList.length === 0) return -1;
    if(shuffleOn){
      if(queueList.length === 1) return 0;
      let next; do{ next = Math.floor(Math.random() * queueList.length); } while(next === currentIndex);
      return next;
    }
    let next = currentIndex + 1;
    if(next >= queueList.length){ if(repeatMode === 1) return 0; return auto ? -1 : 0; }
    return next;
  }

  function goNext(auto){ const next = pickNextIndex(auto); if(next === -1){ stopPlayback(); return; } playIndex(next); }
  function goPrev(){
    if(queueList.length === 0) return;
    let prev = currentIndex - 1;
    if(prev < 0) prev = shuffleOn ? Math.floor(Math.random()*queueList.length) : queueList.length - 1;
    playIndex(prev);
  }

  function startProgressLoop(){
    stopProgressLoop();
    progressTimer = setInterval(()=>{
      if(!playerReady || !player.getDuration) return;
      const dur = player.getDuration() || 0, cur = player.getCurrentTime() || 0;
      els.progressFill.style.width = dur ? `${(cur/dur)*100}%` : '0%';
      els.curTime.textContent = formatTime(cur); els.durTime.textContent = formatTime(dur);
    }, 500);
  }
  function stopProgressLoop(){ if(progressTimer) clearInterval(progressTimer); }
  function formatTime(sec){ sec = Math.floor(sec || 0); return `${Math.floor(sec/60)}:${(sec%60).toString().padStart(2,'0')}`; }

  els.progressTrack.addEventListener('click', (e)=>{
    if(!playerReady || currentIndex === -1) return;
    const rect = els.progressTrack.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    player.seekTo((player.getDuration() || 0) * pct, true);
  });

  els.addBtn.addEventListener('click', addSong);
  els.urlInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') addSong(); });
  els.playBtn.addEventListener('click', togglePlay);
  els.nextBtn.addEventListener('click', ()=> goNext(false));
  els.prevBtn.addEventListener('click', goPrev);
  els.shuffleBtn.addEventListener('click', ()=>{ shuffleOn = !shuffleOn; els.shuffleBtn.classList.toggle('active', shuffleOn); });
  els.repeatBtn.addEventListener('click', ()=>{
    repeatMode = (repeatMode + 1) % 3;
    els.repeatBtn.classList.toggle('active', repeatMode !== 0);
    els.repeatBtn.textContent = repeatMode === 2 ? '🔂' : '🔁';
  });
  els.volume.addEventListener('input', ()=>{ if(playerReady) player.setVolume(Number(els.volume.value)); });
  els.genreBtn.addEventListener('click', addRandomByGenre);

  renderQueue();
</script>
</body>
</html>
